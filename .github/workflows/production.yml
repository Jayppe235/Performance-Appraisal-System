name: Production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pmas-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, openssl, mbstring, gd, zip, curl
          coverage: none
      - run: npm ci
      - run: composer install --no-interaction --prefer-dist
      - run: bash -n scripts/*.sh
      - run: npm test
      - run: vendor/bin/phpunit --configuration phpunit.xml.dist
      - run: npm run build
      - run: bash scripts/Build-ProductionBundle.sh --skip-tests
      - uses: actions/upload-artifact@v4
        with:
          name: pmas-production-${{ github.sha }}
          path: release/pmas-production.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pmas-production-${{ github.sha }}
          path: release
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PMAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PMAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/pmas_deploy
          chmod 600 ~/.ssh/pmas_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.PMAS_SSH_HOST }}
          SSH_PORT: ${{ secrets.PMAS_SSH_PORT }}
          SSH_USER: ${{ secrets.PMAS_SSH_USER }}
        run: |
          scp -P "${SSH_PORT:-22}" -i ~/.ssh/pmas_deploy \
            release/pmas-production.tar.gz \
            "$SSH_USER@$SSH_HOST:/tmp/pmas-${GITHUB_SHA}.tar.gz"
      - name: Activate release
        env:
          SSH_HOST: ${{ secrets.PMAS_SSH_HOST }}
          SSH_PORT: ${{ secrets.PMAS_SSH_PORT }}
          SSH_USER: ${{ secrets.PMAS_SSH_USER }}
          DEPLOY_ROOT: ${{ secrets.PMAS_DEPLOY_ROOT }}
        run: |
          ssh -p "${SSH_PORT:-22}" -i ~/.ssh/pmas_deploy "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DEPLOY_ROOT' '/tmp/pmas-${GITHUB_SHA}.tar.gz' '${GITHUB_SHA}'" \
            < scripts/Deploy-Production.sh
      - name: Verify and rollback on failure
        env:
          HEALTH_URL: ${{ secrets.PMAS_HEALTH_URL }}
          SSH_HOST: ${{ secrets.PMAS_SSH_HOST }}
          SSH_PORT: ${{ secrets.PMAS_SSH_PORT }}
          SSH_USER: ${{ secrets.PMAS_SSH_USER }}
          DEPLOY_ROOT: ${{ secrets.PMAS_DEPLOY_ROOT }}
        run: |
          if ! curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            --max-time 15 "$HEALTH_URL/api/health.php" |
            php -r '$v=json_decode(stream_get_contents(STDIN),true); exit(($v["ok"]??false)===true?0:1);'
          then
            ssh -p "${SSH_PORT:-22}" -i ~/.ssh/pmas_deploy "$SSH_USER@$SSH_HOST" \
              "bash -s -- '$DEPLOY_ROOT'" < scripts/Rollback-Production.sh
            exit 1
          fi
